apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-ai-ftsy-football-sum-deployment
  namespace: project-ai-ftsy-football-sum 
spec:
  replicas: 1
  # The data volume is ReadWriteOnce, so a new pod cannot come up beside the old
  # one holding it. Replace rather than roll, or a deploy waits forever.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: project-ai-ftsy-football-sum
  template:
    metadata:
      labels:
        app: project-ai-ftsy-football-sum
    spec:
      containers:
      - name: project-ai-ftsy-football-sum-container
        image: project-ai-ftsy-football-sum:v1
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        envFrom:
        - secretRef:
            name: project-ai-ftsy-football-sum-secrets
        - configMapRef:
            name: project-ai-ftsy-football-sum-config
        env:
        # Saved runs and the cached player reference. Named here as well as in
        # the image so the mount below and the path the app writes to are one
        # fact in one file.
        - name: FFSUM_DATA_DIR
          value: /data
        volumeMounts:
        - name: data
          mountPath: /data
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
        - containerPort: 8000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: project-ai-ftsy-football-sum-data
