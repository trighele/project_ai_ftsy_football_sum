services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9193:8000"  # host:container
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL}
    # The same path the Deployment's PersistentVolumeClaim is mounted at, so
    # saved runs and the cached player reference outlive the container here too.
    volumes:
      - ffsum-data:/data

volumes:
  ffsum-data:
