name: Build and publish image

on:
  push:
    branches:
      - main # a merge to main is the only thing that moves `latest`
  workflow_dispatch: # a manual run of any branch, published under a dev tag only

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the token Actions already provides

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3 # required for the type=gha cache backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every tag this repository can publish is listed here, each one gated on
      # the event that produces it. Read top to bottom: a push to main writes
      # `latest` and a `sha-` tag; a manual run writes one dated dev tag and
      # nothing else. Watchtower follows `latest`, so a manual run cannot reach
      # the live app — that property is this block, not a shell conditional.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ffsum
          flavor: latest=false # `latest` is written below, on push only, or not at all
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=dev-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
